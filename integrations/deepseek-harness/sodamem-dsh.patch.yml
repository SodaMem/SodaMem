# DeepSeek Harness (dsh) Cordis patch — SodaMem MCP (remote).
# Usage: npx @deepseek-ai/dsh web --patch ./integrations/deepseek-harness/sodamem-dsh.patch.yml
# First run: sodamem daemon ensure
# Put SODAMEM_LLM_* and SODAMEM_MCP_ALLOW_WRITE=1 on the daemon env / .env.
# Guide: ./README.md

- insert:
    - id: mcp-sodamem
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: sodamem
        command: sodamem-mcp
        args: []
        env:
          SODAMEM_API_URL: 'http://127.0.0.1:8000'
          SODAMEM_USER_ID: 'default'
        toolCallTimeoutMs: 120000
        failOnStartupError: true
